<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="meterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4EC9B0"/>
      <stop offset="70%" style="stop-color:#F5F5F0"/>
      <stop offset="100%" style="stop-color:#CE9178"/>
    </linearGradient>
    <linearGradient id="faderGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2A2A2A"/>
      <stop offset="100%" style="stop-color:#4EC9B0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="400" fill="#2A2A2A"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#F5F5F0">Material 3 Widgets</text>
  
  <!-- Row 1 -->
  
  <!-- Button -->
  <g transform="translate(50, 60)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="40" y="50" width="100" height="40" rx="20" fill="#F5F5F0"/>
    <text x="90" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2A2A2A">Button</text>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Button</text>
  </g>
  
  <!-- Slider -->
  <g transform="translate(260, 60)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="20" y="65" width="140" height="6" rx="3" fill="#555"/>
    <rect x="20" y="65" width="90" height="6" rx="3" fill="#4EC9B0"/>
    <circle cx="110" cy="68" r="10" fill="#F5F5F0"/>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Slider</text>
  </g>
  
  <!-- Fader -->
  <g transform="translate(470, 60)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="75" y="25" width="30" height="80" rx="4" fill="#333"/>
    <rect x="75" y="45" width="30" height="60" rx="4" fill="url(#faderGrad)"/>
    <rect x="70" y="40" width="40" height="12" rx="2" fill="#F5F5F0"/>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Fader</text>
  </g>
  
  <!-- Toggle -->
  <g transform="translate(680, 60)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="55" y="55" width="70" height="30" rx="15" fill="#4EC9B0"/>
    <circle cx="110" cy="70" r="12" fill="#F5F5F0"/>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Toggle</text>
  </g>
  
  <!-- Row 2 -->
  
  <!-- Card -->
  <g transform="translate(50, 220)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="30" y="30" width="120" height="70" rx="8" fill="#333" filter="url(#shadow)"/>
    <rect x="40" y="45" width="60" height="8" rx="2" fill="#F5F5F0"/>
    <rect x="40" y="60" width="90" height="6" rx="2" fill="#666"/>
    <rect x="40" y="72" width="70" height="6" rx="2" fill="#666"/>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Card</text>
  </g>
  
  <!-- Meter -->
  <g transform="translate(260, 220)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="60" y="25" width="20" height="80" rx="2" fill="#333"/>
    <rect x="60" y="35" width="20" height="70" rx="2" fill="url(#meterGrad)"/>
    <rect x="100" y="25" width="20" height="80" rx="2" fill="#333"/>
    <rect x="100" y="55" width="20" height="50" rx="2" fill="url(#meterGrad)"/>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Meter</text>
  </g>
  
  <!-- TextField -->
  <g transform="translate(470, 220)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <rect x="25" y="50" width="130" height="36" rx="4" fill="none" stroke="#4EC9B0" stroke-width="2"/>
    <text x="35" y="43" font-family="system-ui, sans-serif" font-size="10" fill="#4EC9B0">Label</text>
    <text x="35" y="73" font-family="system-ui, sans-serif" font-size="12" fill="#888">Enter text...</text>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">TextField</text>
  </g>
  
  <!-- Knob -->
  <g transform="translate(680, 220)">
    <rect width="180" height="140" rx="12" fill="#1E1E1E" filter="url(#shadow)"/>
    <circle cx="90" cy="60" r="30" fill="#333" stroke="#4EC9B0" stroke-width="3"/>
    <circle cx="90" cy="60" r="22" fill="#444"/>
    <line x1="90" y1="60" x2="90" y2="42" stroke="#F5F5F0" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F5F5F0">Knob</text>
  </g>
</svg>
